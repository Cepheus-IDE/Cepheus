      - name: Import %%CERT_KIND%% certificate
        env:
          P12_BASE64: ${{ secrets.%%P12_SECRET%% }}
          P12_PASSWORD: ${{ secrets.%%P12_PASSWORD_SECRET%% }}
        run: |
          set -euo pipefail
          if [ -z "$P12_BASE64" ]; then
            echo "::error::Repository secret %%P12_SECRET%% is not set (see the signing checklist in Cepheus › Apple Builds)."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/cepheus-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo -n "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -m1 '%%IDENTITY_MATCH%%' | sed -E 's/.*"(.*)"/\1/' || true)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
