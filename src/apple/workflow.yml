# Generated by Cepheus IDE (Apple Builds) for this %%LABEL%% project.
# Builds on GitHub-hosted macOS runners, so no Mac is needed on your desk.
# Run it from Cepheus (Apple Builds view) or from the repository's Actions tab.
# Signing material comes only from repository secrets; nothing secret is stored in this file.
# GitHub bills macOS runner minutes for private repositories: https://docs.github.com/billing
name: Cepheus Apple build

on:
  workflow_dispatch:
    inputs:
      scheme:
        description: Xcode scheme or app name
        type: string
        default: %%SCHEME_YAML%%
      configuration:
        description: Build configuration
        type: choice
        options: [Debug, Release]
        default: %%CONFIGURATION%%
      target:
        description: What to build
        type: choice
        options: [%%TARGETS%%]
        default: %%DEFAULT_TARGET%%
%%EXTRA_INPUTS%%%%PUSH%%
concurrency:
  group: cepheus-apple-${{ github.ref }}-${{ inputs.target || 'push' }}
  cancel-in-progress: true

env:
  SCHEME: ${{ inputs.scheme || %%SCHEME_EXPR%% }}
  CONFIGURATION: ${{ inputs.configuration || '%%CONFIGURATION%%' }}
  XCODE_VERSION: %%XCODE%%
  PROJECT_DIR: %%PROJECT_DIR%%

jobs:
%%JOBS%%
