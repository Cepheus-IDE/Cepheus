[package]
name = "cepheus-ide"
version = "0.1.0"
description = "Cepheus IDE - a lightweight agentic code editor"
edition = "2021"
license = "MIT"

[lib]
name = "cepheus_ide_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "devtools"] } # unstable: multi-webview (integrated browser); devtools: inspect previews in release builds
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
portable-pty = "0.8"
ignore = "0.4"
regex = "1"
notify = "6"
trash = "5"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "4"
async-trait = "0.1"
sha2 = "0.10"
# Profiles / enterprise / continuity
tauri-plugin-updater = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
