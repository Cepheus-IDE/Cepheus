name: Pages

# Publishes https://cepheus-ide.github.io/Cepheus/ :
#   /      the landing site (landing/*)
#   /app/  Cepheus Web in browser-only mode (folders via the File System Access API; no server)
# One-time setup: Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the browser app
        # No API key is ever embedded: browser mode uses keys the user enters (kept in their browser).
        run: npx vite build --config vite.config.web.ts --base /Cepheus/app/

      - name: Assemble the site
        run: |
          mkdir -p site/app
          cp -R landing/. site/
          cp -R dist-web/. site/app/
          touch site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
